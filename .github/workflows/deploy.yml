name: Deploy Rolls-In
on:
  push:
    branches: [ main ] # Toda vez que você enviar código para a branch principal

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Aqui o robô do GitHub reconstrói o arquivo da Keystore usando aquele texto Base64 que você salvou
      - name: Decode Keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/rollsin.keystore

      # Comando para gerar o pacote oficial (.AAB)
      # Nota: Ajustaremos o comando abaixo dependendo se seu app é React Native ou Flutter
      - name: Build Android Release
        run: |
          cd android
          ./gradlew bundleRelease
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}

      # Guarda o arquivo pronto para você baixar
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-bundle
          path: android/app/build/outputs/bundle/release/*.aab
