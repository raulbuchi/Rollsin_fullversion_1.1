name: Deploy Rolls-In
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Next.js
        run: npm run build
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      # Nota: Como o AI Studio gerou Next.js, para transformar em app Android
      # Precisaremos usar o Capacitor depois. Por enquanto, vamos garantir
      # que o GitHub consiga rodar o build do seu código sem erros.
